<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CherryJoe 3D River Dodge</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #87CEEB; font-family: 'Segoe UI', Tahoma, sans-serif; }
        #game-ui { position: absolute; top: 15px; left: 20px; width: 100%; pointer-events: none; z-index: 10; }
        #score { color: #ffffff; font-size: 28px; font-weight: 900; text-shadow: 2px 2px 5px rgba(0,0,0,0.7); }
        #game-over { display: none; position: absolute; top: 50vh; left: 50vw; transform: translate(-50%, -50%); text-align: center; background: rgba(255, 255, 255, 0.95); padding: 40px; border-radius: 20px; box-shadow: 0 15px 40px rgba(0,0,0,0.3); pointer-events: auto; }
        #game-over h1 { color: #ef4444; margin-top: 0; font-size: 38px; font-weight: 900; letter-spacing: 2px; }
        #game-over button { background: #10b981; color: white; border: none; padding: 15px 30px; font-size: 20px; font-weight: bold; border-radius: 50px; cursor: pointer; transition: 0.3s; box-shadow: 0 5px 15px rgba(16, 185, 129, 0.4); }
        #game-over button:hover { background: #059669; transform: scale(1.05); }
        #controls-hint { position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%); color: white; font-weight: bold; text-shadow: 1px 1px 4px black; font-size: 16px; text-align: center; width: 100%; pointer-events: none; }
    </style>
    <!-- THREE.JS LIBRARY -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

    <div id="game-ui">
        <div id="score">Score: 0</div>
    </div>
    
    <div id="controls-hint">Use LEFT and RIGHT arrow keys (or tap sides of screen) to steer the Bangka!</div>

    <div id="game-over">
        <h1>CRASHED!</h1>
        <p id="final-score" style="font-size: 22px; font-weight: bold; color: #1e293b; margin-bottom: 25px;"></p>
        <button onclick="resetGame()">Try Again</button>
    </div>

    <script>
        // ==========================================
        // 1. SETUP SCENE, CAMERA, & RENDERER
        // ==========================================
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x87CEEB); // Sky blue background
        scene.fog = new THREE.Fog(0x87CEEB, 20, 80); // Fog aron nindot tan-awon sa layo

        const camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 6, 12);
        camera.lookAt(0, 0, 0);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        document.body.appendChild(renderer.domElement);

        // ==========================================
        // 2. LIGHTING
        // ==========================================
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.7);
        scene.add(ambientLight);
        const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
        dirLight.position.set(10, 20, 10);
        dirLight.castShadow = true;
        scene.add(dirLight);

        // ==========================================
        // 3. RIVER & GROUND
        // ==========================================
        const riverGeo = new THREE.PlaneGeometry(35, 200);
        const riverMat = new THREE.MeshStandardMaterial({ color: 0x0284c7 }); // River water color
        const river = new THREE.Mesh(riverGeo, riverMat);
        river.rotation.x = -Math.PI / 2;
        river.receiveShadow = true;
        scene.add(river);

        // ==========================================
        // 4. PLAYER (PINOY BANGKA)
        // ==========================================
        const player = new THREE.Group();
        const woodMat = new THREE.MeshStandardMaterial({ color: 0x8B4513 }); // Brown wood
        const paintMat = new THREE.MeshStandardMaterial({ color: 0xffffff }); // White paint stripe

        // Lawas sa Bangka (Hull)
        const hullGeo = new THREE.BoxGeometry(1.2, 0.6, 3);
        const hull = new THREE.Mesh(hullGeo, woodMat);
        hull.position.y = 0.3;
        hull.castShadow = true;
        player.add(hull);

        // Atubangan sa Bangka (Bow)
        const bowGeo = new THREE.ConeGeometry(0.6, 1.5, 4);
        const bow = new THREE.Mesh(bowGeo, paintMat);
        bow.rotation.x = -Math.PI / 2;
        bow.rotation.y = Math.PI / 4;
        bow.position.set(0, 0.3, -2.25);
        bow.castShadow = true;
        player.add(bow);

        // Luyo sa Bangka (Stern)
        const stern = new THREE.Mesh(bowGeo, paintMat);
        stern.rotation.x = Math.PI / 2;
        stern.rotation.y = Math.PI / 4;
        stern.position.set(0, 0.3, 2.25);
        stern.castShadow = true;
        player.add(stern);

        // Katig (Outriggers - Left & Right)
        const katigGeo = new THREE.CylinderGeometry(0.1, 0.1, 4, 8);
        const bambooMat = new THREE.MeshStandardMaterial({ color: 0xd97706 });
        
        const katigL = new THREE.Mesh(katigGeo, bambooMat);
        katigL.rotation.x = Math.PI / 2;
        katigL.position.set(-1.8, 0.2, 0);
        player.add(katigL);

        const katigR = new THREE.Mesh(katigGeo, bambooMat);
        katigR.rotation.x = Math.PI / 2;
        katigR.position.set(1.8, 0.2, 0);
        player.add(katigR);

        // Mga Kahoy Nagkonektar sa Katig
        const poleGeo = new THREE.CylinderGeometry(0.05, 0.05, 3.6, 8);
        const pole1 = new THREE.Mesh(poleGeo, bambooMat);
        pole1.rotation.z = Math.PI / 2;
        pole1.position.set(0, 0.4, -1);
        player.add(pole1);

        const pole2 = new THREE.Mesh(poleGeo, bambooMat);
        pole2.rotation.z = Math.PI / 2;
        pole2.position.set(0, 0.4, 1);
        player.add(pole2);

        scene.add(player);

        // ==========================================
        // 5. GAME VARIABLES & LOGIC
        // ==========================================
        let obstacles = [];
        let mountains = [];
        let isGameOver = false;
        let score = 0;
        let speed = 0.25;
        
        const keys = { ArrowLeft: false, ArrowRight: false, a: false, d: false };

        // Key Listeners
        window.addEventListener('keydown', (e) => { if(keys.hasOwnProperty(e.key)) keys[e.key] = true; });
        window.addEventListener('keyup', (e) => { if(keys.hasOwnProperty(e.key)) keys[e.key] = false; });

        // Touch Controls para sa Mobile
        window.addEventListener('touchstart', (e) => {
            if (e.touches[0].clientX < window.innerWidth / 2) keys.ArrowLeft = true;
            else keys.ArrowRight = true;
        });
        window.addEventListener('touchend', () => { keys.ArrowLeft = false; keys.ArrowRight = false; });

        // ==========================================
        // 6. SPAWNERS (ROCKS & MOUNTAINS)
        // ==========================================
        const rockMat = new THREE.MeshStandardMaterial({ color: 0x475569, roughness: 0.8 });
        const mtnMat = new THREE.MeshStandardMaterial({ color: 0x166534, roughness: 1 }); // Dark green mountain

        function spawnObstacle() {
            if (isGameOver) return;
            // Mag-spawn og bato sa suba
            const size = 1.5 + Math.random();
            const rockGeo = new THREE.DodecahedronGeometry(size, 1);
            const rock = new THREE.Mesh(rockGeo, rockMat);
            
            // Random position sa suba (x limits: -12 to 12)
            rock.position.set((Math.random() - 0.5) * 24, size/2, -80);
            rock.castShadow = true;
            
            scene.add(rock);
            obstacles.push(rock);
            
            let spawnTime = Math.max(400, 1200 - (score * 15));
            setTimeout(spawnObstacle, spawnTime);
        }

        function spawnMountains() {
            if (isGameOver) return;
            // Mag-spawn og Bukid sa Wala (Left)
            const mtnGeo = new THREE.ConeGeometry(5 + Math.random()*5, 8 + Math.random()*10, 5);
            const mtnL = new THREE.Mesh(mtnGeo, mtnMat);
            mtnL.position.set(-20 - Math.random()*5, 0, -100);
            scene.add(mtnL);
            mountains.push(mtnL);

            // Mag-spawn og Bukid sa Tuo (Right)
            const mtnR = new THREE.Mesh(mtnGeo, mtnMat);
            mtnR.position.set(20 + Math.random()*5, 0, -100);
            scene.add(mtnR);
            mountains.push(mtnR);

            setTimeout(spawnMountains, 300); // Spawn rapidly to create a continuous mountain range
        }

        // Start Spawners
        setTimeout(spawnObstacle, 1000);
        spawnMountains(); // Initial spawn

        // ==========================================
        // 7. MAIN ANIMATION LOOP
        // ==========================================
        function animate() {
            if (isGameOver) return;
            requestAnimationFrame(animate);

            // Player Movement (Limit sa daplin sa suba)
            if ((keys.ArrowLeft || keys.a) && player.position.x > -14) player.position.x -= 0.25;
            if ((keys.ArrowRight || keys.d) && player.position.x < 14) player.position.x += 0.25;

            // Player tilt effect (mo-kiling ang bangka inig liko)
            if (keys.ArrowLeft || keys.a) player.rotation.z = Math.min(player.rotation.z + 0.05, 0.2);
            else if (keys.ArrowRight || keys.d) player.rotation.z = Math.max(player.rotation.z - 0.05, -0.2);
            else player.rotation.z *= 0.9; // Mobalik sa sentro kung dili pisliton

            // Move Mountains
            for (let i = 0; i < mountains.length; i++) {
                let mtn = mountains[i];
                mtn.position.z += speed;
                if (mtn.position.z > 20) {
                    scene.remove(mtn);
                    mountains.splice(i, 1);
                    i--;
                }
            }

            // Move Obstacles and Check Collisions
            for (let i = 0; i < obstacles.length; i++) {
                let obs = obstacles[i];
                obs.position.z += speed;

                // Bangka Collision Box is roughly width 3.6 (including katig) and length 5
                // Gi-adjust ang math aron dili ra kaayo sayon ma-igo
                if (Math.abs(player.position.x - obs.position.x) < 2.0 && 
                    Math.abs(player.position.z - obs.position.z) < 2.5) {
                    gameOver();
                }

                // Add Score
                if (obs.position.z > 5 && !obs.passed) {
                    score += 10;
                    document.getElementById('score').innerText = "Score: " + score;
                    obs.passed = true;
                    speed += 0.005; // Pa-paspason og gamay
                }

                // Remove obs
                if (obs.position.z > 20) {
                    scene.remove(obs);
                    obstacles.splice(i, 1);
                    i--;
                }
            }
            renderer.render(scene, camera);
        }

        // ==========================================
        // 8. GAME OVER & RESET
        // ==========================================
        function gameOver() {
            isGameOver = true;
            document.getElementById('game-over').style.display = 'block';
            document.getElementById('final-score').innerText = "Total Distance: " + score;
        }

        window.resetGame = function() {
            isGameOver = false;
            score = 0;
            speed = 0.25;
            document.getElementById('score').innerText = "Score: 0";
            document.getElementById('game-over').style.display = 'none';
            player.position.x = 0;
            player.rotation.z = 0;
            
            // Limpyohan ang old objects
            obstacles.forEach(obs => scene.remove(obs));
            obstacles = [];
            mountains.forEach(mtn => scene.remove(mtn));
            mountains = [];
            
            spawnObstacle();
            spawnMountains();
            animate();
        }

        // Handle Window Resize
        window.addEventListener('resize', () => {
            renderer.setSize(window.innerWidth, window.innerHeight);
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
        });

        animate(); // Start Game
    </script>
</body>
</html>
