<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CherryJoe 3D River Dodge</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #87CEEB; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        #game-ui { position: absolute; top: 10px; left: 10px; width: 100%; pointer-events: none; z-index: 10; }
        #score { color: #ffffff; font-size: 24px; font-weight: bold; text-shadow: 2px 2px 4px rgba(0,0,0,0.5); }
        #game-over { display: none; position: absolute; top: 50vh; left: 50vw; transform: translate(-50%, -50%); text-align: center; background: rgba(255, 255, 255, 0.9); padding: 30px; border-radius: 15px; box-shadow: 0 10px 30px rgba(0,0,0,0.2); pointer-events: auto; }
        #game-over h1 { color: #ef4444; margin-top: 0; font-size: 32px; }
        #game-over button { background: #10b981; color: white; border: none; padding: 12px 25px; font-size: 18px; font-weight: bold; border-radius: 50px; cursor: pointer; transition: 0.3s; }
        #game-over button:hover { background: #059669; transform: scale(1.05); }
        #controls-hint { position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%); color: white; font-weight: bold; text-shadow: 1px 1px 3px black; font-size: 14px; }
    </style>
    <!-- THREE.JS LIBRARY -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

    <div id="game-ui">
        <div id="score">Score: 0</div>
    </div>
    
    <div id="controls-hint">Use LEFT and RIGHT arrow keys to dodge!</div>

    <div id="game-over">
        <h1>GAME OVER!</h1>
        <p id="final-score" style="font-size: 20px; font-weight: bold; color: #1e293b;"></p>
        <button onclick="resetGame()">Play Again</button>
    </div>

    <script>
        // 1. SETUP SCENE, CAMERA, & RENDERER
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x87CEEB); // Sky blue background
        
        // Add fog for a better horizon effect
        scene.fog = new THREE.Fog(0x87CEEB, 10, 50);

        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 5, 10);
        camera.lookAt(0, 0, 0);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        document.body.appendChild(renderer.domElement);

        // 2. LIGHTING
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
        scene.add(ambientLight);
        
        const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
        dirLight.position.set(10, 20, 10);
        dirLight.castShadow = true;
        scene.add(dirLight);

        // 3. RIVER (GROUND)
        const riverGeo = new THREE.PlaneGeometry(30, 200);
        const riverMat = new THREE.MeshStandardMaterial({ color: 0x0ea5e9 }); // River water color
        const river = new THREE.Mesh(riverGeo, riverMat);
        river.rotation.x = -Math.PI / 2;
        river.receiveShadow = true;
        scene.add(river);

        // 4. PLAYER (BOAT)
        const playerGeo = new THREE.BoxGeometry(1, 1, 2);
        const playerMat = new THREE.MeshStandardMaterial({ color: 0xfacc15 }); // Yellow boat
        const player = new THREE.Mesh(playerGeo, playerMat);
        player.position.y = 0.5;
        player.castShadow = true;
        scene.add(player);

        // 5. GAME VARIABLES & LOGIC
        let obstacles = [];
        let isGameOver = false;
        let score = 0;
        let speed = 0.2;
        
        const keys = { ArrowLeft: false, ArrowRight: false, a: false, d: false };

        // Key Listeners
        window.addEventListener('keydown', (e) => { if(keys.hasOwnProperty(e.key)) keys[e.key] = true; });
        window.addEventListener('keyup', (e) => { if(keys.hasOwnProperty(e.key)) keys[e.key] = false; });

        // Touch Controls para sa Mobile (Tap left/right side of screen)
        window.addEventListener('touchstart', (e) => {
            const touchX = e.touches[0].clientX;
            if (touchX < window.innerWidth / 2) keys.ArrowLeft = true;
            else keys.ArrowRight = true;
        });
        window.addEventListener('touchend', () => { keys.ArrowLeft = false; keys.ArrowRight = false; });

        // Spawn Obstacles (Rocks)
        function spawnObstacle() {
            if (isGameOver) return;
            const rockGeo = new THREE.BoxGeometry(1.5, 1.5, 1.5);
            const rockMat = new THREE.MeshStandardMaterial({ color: 0x475569 }); // Gray rock
            const rock = new THREE.Mesh(rockGeo, rockMat);
            
            // Random position across the river width
            rock.position.x = (Math.random() - 0.5) * 10; 
            rock.position.y = 0.75;
            rock.position.z = -50; // Spawn far away
            rock.castShadow = true;
            
            scene.add(rock);
            obstacles.push(rock);
            
            // Spawn faster as score increases
            let spawnTime = Math.max(500, 1500 - (score * 20));
            setTimeout(spawnObstacle, spawnTime);
        }

        setTimeout(spawnObstacle, 1000);

        // 6. MAIN ANIMATION LOOP
        function animate() {
            if (isGameOver) return;
            requestAnimationFrame(animate);

            // Player Movement
            if ((keys.ArrowLeft || keys.a) && player.position.x > -6) player.position.x -= 0.15;
            if ((keys.ArrowRight || keys.d) && player.position.x < 6) player.position.x += 0.15;

            // Move obstacles and check collisions
            for (let i = 0; i < obstacles.length; i++) {
                let obs = obstacles[i];
                obs.position.z += speed;

                // Collision Detection (Simple bounding box math)
                if (Math.abs(player.position.x - obs.position.x) < 1.2 && 
                    Math.abs(player.position.z - obs.position.z) < 1.5) {
                    gameOver();
                }

                // Remove passed obstacles and add score
                if (obs.position.z > 5 && !obs.passed) {
                    score += 10;
                    document.getElementById('score').innerText = "Score: " + score;
                    obs.passed = true;
                    speed += 0.005; // Increase speed slightly
                }

                if (obs.position.z > 15) {
                    scene.remove(obs);
                    obstacles.splice(i, 1);
                    i--;
                }
            }

            renderer.render(scene, camera);
        }

        function gameOver() {
            isGameOver = true;
            document.getElementById('game-over').style.display = 'block';
            document.getElementById('final-score').innerText = "You scored: " + score;
        }

        window.resetGame = function() {
            isGameOver = false;
            score = 0;
            speed = 0.2;
            document.getElementById('score').innerText = "Score: 0";
            document.getElementById('game-over').style.display = 'none';
            player.position.x = 0;
            
            // Clear old obstacles
            obstacles.forEach(obs => scene.remove(obs));
            obstacles = [];
            
            spawnObstacle();
            animate();
        }

        // Handle Window Resize
        window.addEventListener('resize', () => {
            renderer.setSize(window.innerWidth, window.innerHeight);
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
        });

        animate(); // Start Game
    </script>
</body>
</html>
